<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Job Pages Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 18px 60px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin: 0 0 25px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .summary-number {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-label {
      font-size: 13px;
      color: #777;
    }

    .toolbar {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .toolbar-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    select {
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 14px;
      background: white;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    select {
      min-width: 170px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .refresh-message {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }

    .site-list {
      display: grid;
      gap: 13px;
    }

    .site-card {
      background: white;
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .site-name {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .site-url {
      color: #777;
      font-size: 13px;
      word-break: break-all;
    }

    .site-url a {
      color: inherit;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-ok {
      color: #267536;
      background: #eaf6ec;
    }

    .status-changed {
      color: #b42318;
      background: #fff0ee;
    }

    .status-error {
      color: #9a6700;
      background: #fff7df;
    }

    .status-baseline {
      color: #555;
      background: #eee;
    }

    .site-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .info-label {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 14px;
    }

    .details-button {
      background: transparent;
      color: #333;
      padding: 7px 0;
      margin-top: 13px;
      font-size: 13px;
    }

    .history {
      display: none;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 5px;
    }

    .history.open {
      display: block;
    }

    .history-row {
      display: grid;
      grid-template-columns: 110px 180px 1fr;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f1f1f1;
      font-size: 13px;
    }

    .history-changed {
      color: #b42318;
      font-weight: 600;
    }

    .history-error {
      color: #9a6700;
    }

    .last-run {
      margin: 12px 0 22px;
      font-size: 14px;
      color: #666;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    @media (max-width: 700px) {
      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .site-header {
        display: block;
      }

      .status {
        margin-top: 10px;
      }

      .site-info {
        grid-template-columns: 1fr;
      }

      .history-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Job Pages Monitor</h1>

  <p class="subtitle">
    Monitoraggio automatico delle pagine di lavoro e vacancies
  </p>

  <div class="summary">

    <div class="summary-card">
      <div id="totalSites" class="summary-number">-</div>
      <div class="summary-label">Siti monitorati</div>
    </div>

    <div class="summary-card">
      <div id="okSites" class="summary-number">-</div>
      <div class="summary-label">Senza cambiamenti</div>
    </div>

    <div class="summary-card">
      <div id="changedSites" class="summary-number">-</div>
      <div class="summary-label">Con cambiamenti</div>
    </div>

    <div class="summary-card">
      <div id="errorSites" class="summary-number">-</div>
      <div class="summary-label">Con errori</div>
    </div>

  </div>

  <div id="lastRun" class="last-run">
    Ultimo controllo: -
  </div>

  <div class="toolbar">

    <div class="toolbar-row">

      <input
        id="search"
        type="search"
        placeholder="Cerca organizzazione..."
        oninput="renderSites()"
      >

      <select
        id="filter"
        onchange="renderSites()"
      >
        <option value="all">Tutti i siti</option>
        <option value="changed">Cambiamenti rilevati</option>
        <option value="unchanged">Nessun cambiamento</option>
        <option value="error">Errori</option>
      </select>

      <button
        id="refreshPage"
        onclick="loadState()"
      >
        Ricarica dati
      </button>

    </div>

    <div
      id="refreshMessage"
      class="refresh-message">
    </div>

  </div>

  <div id="sites" class="site-list">
    Caricamento...
  </div>

</div>


<script>

  let stateData = null;


  function formatDate(value) {

    if (!value) {
      return "Mai";
    }

    const date = new Date(value);

    return new Intl.DateTimeFormat(
      "it-IT",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    ).format(date);

  }


  function getLatestEntry(site) {

    if (
      !site.history ||
      site.history.length === 0
    ) {
      return null;
    }

    return site.history[
      site.history.length - 1
    ];

  }


  function getStatus(site) {

    const latest = getLatestEntry(site);

    if (!latest) {
      return "baseline";
    }

    return latest.status;

  }


  function getStatusText(status) {

    switch (status) {

      case "changed":
        return "Cambiamento rilevato";

      case "error":
        return "Errore";

      case "baseline":
        return "Baseline";

      default:
        return "Nessun cambiamento";
    }

  }


  function getStatusClass(status) {

    switch (status) {

      case "changed":
        return "status-changed";

      case "error":
        return "status-error";

      case "baseline":
        return "status-baseline";

      default:
        return "status-ok";
    }

  }


  async function loadState() {

    const button =
      document.getElementById("refreshPage");

    const message =
      document.getElementById("refreshMessage");

    button.disabled = true;
    button.textContent = "Caricamento...";

    try {

      const response = await fetch(
        `state.json?t=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          `Errore HTTP ${response.status}`
        );
      }

      stateData = await response.json();

      renderSummary();
      renderSites();

      message.textContent =
        "Dati aggiornati dalla versione più recente di state.json.";

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "Errore nel caricamento di state.json: " +
        error.message;

    }

    finally {

      button.disabled = false;
      button.textContent = "Ricarica dati";

    }

  }


  function renderSummary() {

    const sites = Object.values(
      stateData?.sites || {}
    );

    let changed = 0;
    let errors = 0;
    let ok = 0;

    sites.forEach(site => {

      const status = getStatus(site);

      if (status === "changed") {
        changed++;
      }

      else if (status === "error") {
        errors++;
      }

      else {
        ok++;
      }

    });


    document.getElementById(
      "totalSites"
    ).textContent = sites.length;

    document.getElementById(
      "changedSites"
    ).textContent = changed;

    document.getElementById(
      "errorSites"
    ).textContent = errors;

    document.getElementById(
      "okSites"
    ).textContent = ok;

    document.getElementById(
      "lastRun"
    ).textContent =
      "Ultimo controllo generale: " +
      formatDate(stateData.last_run);

  }


  function renderSites() {

    if (!stateData) {
      return;
    }

    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const filter =
      document
        .getElementById("filter")
        .value;

    const container =
      document.getElementById("sites");


    let sites = Object.entries(
      stateData.sites || {}
    );


    sites = sites.filter(
      ([id, site]) => {

        const status =
          getStatus(site);

        const matchesSearch =
          !search ||
          site.name
            .toLowerCase()
            .includes(search) ||
          site.url
            .toLowerCase()
            .includes(search);

        const matchesFilter =
          filter === "all" ||
          filter === status;

        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


    /*
     * Prima i siti modificati,
     * poi gli errori,
     * poi gli altri.
     */

    const priority = {
      changed: 0,
      error: 1,
      baseline: 2,
      unchanged: 3
    };


    sites.sort((a, b) => {

      const statusA =
        getStatus(a[1]);

      const statusB =
        getStatus(b[1]);

      return (
        priority[statusA] -
        priority[statusB]
      );

    });


    if (!sites.length) {

      container.innerHTML =
        '<div class="empty">Nessun sito corrisponde ai filtri.</div>';

      return;

    }


    container.innerHTML =
      sites.map(
        ([id, site]) =>
          createSiteCard(id, site)
      ).join("");

  }


  function createSiteCard(id, site) {

    const status =
      getStatus(site);

    let lastChangeText =
      "Mai rilevato";

    if (site.last_changed) {

      lastChangeText =
        site.last_changed_check
          ? `#${site.last_changed_check} — ${formatDate(site.last_changed)}`
          : formatDate(site.last_changed);

    }


    const errorHtml =
      site.last_error
        ? `
          <div style="
            margin-top:12px;
            font-size:13px;
            color:#9a6700;
          ">
            ${escapeHtml(site.last_error)}
          </div>
        `
        : "";


    return `

      <div class="site-card">

        <div class="site-header">

          <div>

            <h2 class="site-name">
              ${escapeHtml(site.name)}
            </h2>

            <div class="site-url">

              <a
                href="${escapeHtml(site.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHtml(site.url)}
              </a>

            </div>

          </div>

          <div
            class="status ${getStatusClass(status)}"
          >
            ${getStatusText(status)}
          </div>

        </div>


        <div class="site-info">

          <div>
            <div class="info-label">
              Ultimo controllo
            </div>

            <div class="info-value">
              ${formatDate(site.last_checked)}
            </div>
          </div>


          <div>
            <div class="info-label">
              Ultimo cambiamento
            </div>

            <div class="info-value">
              ${lastChangeText}
            </div>
          </div>


          <div>
            <div class="info-label">
              Controlli totali
            </div>

            <div class="info-value">
              ${site.total_checks || 0}
            </div>
          </div>

        </div>

        ${errorHtml}

        <button
          class="details-button"
          onclick="toggleHistory('${id}', this)"
        >
          Mostra cronologia
        </button>

        <div
          id="history-${id}"
          class="history"
        >
          ${createHistory(site)}
        </div>

      </div>
    `;

  }


  function createHistory(site) {

    const history =
      [...(site.history || [])]
        .reverse();


    if (!history.length) {
      return "Nessuna cronologia.";
    }


    return history.map(entry => {

      let statusText =
        getStatusText(entry.status);

      let cssClass = "";

      if (entry.status === "changed") {
        cssClass = "history-changed";
      }

      else if (entry.status === "error") {
        cssClass = "history-error";
      }


      let extra = "";

      if (
        entry.status === "error" &&
        entry.error
      ) {

        extra =
          ` — ${escapeHtml(entry.error)}`;

      }


      return `

        <div class="history-row">

          <div>
            Controllo #${entry.check}
          </div>

          <div>
            ${formatDate(entry.timestamp)}
          </div>

          <div class="${cssClass}">
            ${statusText}${extra}
          </div>

        </div>

      `;

    }).join("");

  }


  function toggleHistory(id, button) {

    const element =
      document.getElementById(
        `history-${id}`
      );

    element.classList.toggle(
      "open"
    );

    button.textContent =
      element.classList.contains("open")
        ? "Nascondi cronologia"
        : "Mostra cronologia";

  }


  function escapeHtml(value) {

    if (value === null ||
        value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  loadState();


  /*
   * Ricarica automaticamente state.json
   * ogni minuto mentre la pagina è aperta.
   *
   * ATTENZIONE:
   * questo NON esegue un nuovo controllo
   * dei siti. Aggiorna soltanto la dashboard
   * se GitHub Actions ha prodotto nuovi dati.
   */

  setInterval(
    loadState,
    60000
  );

</script>

</body>
</html>
