name: Controlla pagina

on:
  # Controllo automatico una volta al giorno
  schedule:
  - cron: "*/30 * * * *"
    timezone: "Europe/Rome"

  # Permette di avviare il controllo manualmente
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          
      - name: Mostra IP GitHub
        run: |
         echo "IP prima di Tailscale:"
         curl -s https://api.ipify.org
         echo

      - name: Collegati a Tailscale
        uses: tailscale/github-action@v4
        with:
         authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
         ping: ${{ secrets.TAILSCALE_EXIT_NODE }}
         version: latest

      - name: Usa il telefono come exit node
        run: |
         sudo -E tailscale set \
          --exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}

      - name: Verifica exit node
        run: |
         echo "=== Tailscale ==="
         tailscale status

         echo
         echo "IP dopo Tailscale:"
         curl -s https://api.ipify.org
         echo

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Installa dipendenze Python
        run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt

      - name: Installa Chromium
        run: python -m playwright install --with-deps chromium  
          

      - name: Controlla la pagina
        run: python monitor.py

      - name: Controlla se state.json è cambiato
        id: changes
        run: |
          if git diff --quiet state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salva il nuovo stato
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Page Monitor Bot"
          git config user.email "page-monitor@users.noreply.github.com"

          git add state.json
          git commit -m "Aggiorna controllo pagina"
          git push
